<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicar evento – DAComp</title>
<link rel="stylesheet" href="./css/output.css">
</head>

<body class="bg-slate-50 text-dc-900 min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-dc-900 text-white sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="index.html" class="shrink-0">
      <img src="img/logo-dacomp-header.png" alt="DAComp" class="h-10 w-auto object-contain">
    </a>
    <nav class="hidden md:flex gap-8">
      <a href="index.html" class="py-1 border-b-2 border-transparent">Home</a>
      <a href="calendario.html" class="py-1 border-b-2 border-transparent">Calendário</a>
      <a href="ouvidoria.html" class="py-1 border-b-2 border-transparent">Ouvidoria</a>
    </nav>
    <div class="flex items-center gap-2">
      <a id="btn-login" href="login.html" class="bg-white text-dc-900 font-bold rounded-full px-5 py-2 text-sm">Login</a>
      <button id="btn-menu" aria-label="Menu" class="md:hidden p-2">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <nav id="nav-mobile" class="hidden flex-col px-4 pb-3 md:hidden border-t border-white/10">
    <a href="index.html" class="px-2 py-3">Home</a>
    <a href="calendario.html" class="px-2 py-3">Calendário</a>
    <a href="ouvidoria.html" class="px-2 py-3">Ouvidoria</a>
  </nav>
</header>

<!-- CALENDÁRIO -->
<main class="flex-1">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <h3 class="flex flex-wrap items-baseline gap-x-3"><span class="text-3xl font-bold">Publicar evento:</span><span class="text-sm">Aparece no calendário</span></h3>
    <a href="calendario.html" class="inline-block mt-2 text-sm underline">← Voltar ao calendário</a>
    <form id="form-evento" class="mt-6 grid gap-4 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label for="ev-titulo" class="block font-bold text-sm mb-1">Título</label>
        <input id="ev-titulo" type="text" class="w-full rounded border border-slate-300 bg-white px-4 py-3">
      </div>
      <div>
        <label for="ev-data" class="block font-bold text-sm mb-1">Data</label>
        <input id="ev-data" type="date" class="w-full rounded border border-slate-300 bg-white px-4 py-3">
      </div>
      <div>
        <label for="ev-hora" class="block font-bold text-sm mb-1">Horário (opcional)</label>
        <input id="ev-hora" type="time" class="w-full rounded border border-slate-300 bg-white px-4 py-3">
      </div>
      <div class="sm:col-span-2">
        <label for="ev-desc" class="block font-bold text-sm mb-1">Descrição (opcional)</label>
        <textarea id="ev-desc" rows="3" class="w-full rounded border border-slate-300 bg-white px-4 py-3"></textarea>
      </div>
      <p id="ev-msg" class="hidden sm:col-span-2 text-sm rounded px-4 py-3"></p>
      <button type="submit" class="sm:col-span-2 bg-dc-800 text-white font-bold rounded py-3">Publicar no calendário</button>
    </form>

    <h4 class="mt-10 mb-3 font-bold text-lg">Eventos publicados</h4>
    <ul id="ev-lista" class="divide-y divide-slate-200 bg-white border border-slate-300 rounded"></ul>
  </div>
</main>

<!-- FOOTER -->
<footer class="bg-dc-900 text-white mt-8">
  <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row sm:justify-between gap-6">
    <img src="img/logo-dacomp-footer.png" alt="DAComp" class="h-16 w-auto shrink-0 self-start object-contain">
    <div class="space-y-2 text-sm">
      <h4 class="font-bold text-base">Contato</h4>
      <p>dacomp@ufscar.br</p>
      <p>@dacomp_ufscar</p>
      <a href="#" class="inline-block bg-dc-800 rounded-full px-5 py-2 font-bold text-xs">Comunidade do DC</a>
    </div>
  </div>
  <div class="bg-black/25 text-center text-xs py-3">© 2026 DAComp - Todos os direitos reservados</div>
</footer>

<script src="js/comum.js"></script>
<script>

/* apenas admins */
if (!isAdmin()) location.replace('login.html?next=admin.html');

function renderLista() {
  const ev = eventos().sort((a, b) => a.data.localeCompare(b.data));
  $('#ev-lista').innerHTML = ev.length
    ? ev.map(x => `<li class="flex items-center justify-between gap-3 px-4 py-3 text-sm">
        <span><b>${fmt(x.data)}</b>${x.hora ? ' ' + esc(x.hora) : ''} – ${esc(x.titulo)}</span>
        <button data-del="${x.id}" class="text-red-700 font-bold">Excluir</button></li>`).join('')
    : '<li class="px-4 py-3 text-sm">Nenhum evento publicado.</li>';
}

$('#form-evento').addEventListener('submit', e => {
  e.preventDefault();
  const box = $('#ev-msg'); box.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
  const titulo = $('#ev-titulo').value.trim(), data = $('#ev-data').value;
  if (!titulo || !data) {
    box.classList.add('bg-red-100', 'text-red-800'); box.textContent = 'Informe o título e a data.'; return;
  }
  const lista = eventos();
  lista.push({ id: Date.now(), titulo, data, hora: $('#ev-hora').value, desc: $('#ev-desc').value.trim() });
  store.set('dc-eventos', lista);
  box.classList.add('bg-green-100', 'text-green-800'); box.textContent = 'Evento publicado no calendário.';
  e.target.reset(); renderLista();
});

$('#ev-lista').onclick = e => {
  const id = e.target.dataset.del; if (!id) return;
  store.set('dc-eventos', eventos().filter(x => String(x.id) !== id)); renderLista();
};

renderLista();
</script>
</body>
</html>
