<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/pt-br.global.min.js"></script>

<script src="js/comum.js"></script>
<script>
function mostrarDetalhe(data) {
  const doDia = eventos().filter(x => x.data === data);
  $('#cal-detail').innerHTML = doDia.length
    ? doDia.map(x => `<p class="mb-2"><b>${fmt(x.data)}${x.hora ? ' às ' + esc(x.hora) : ''} – ${esc(x.titulo)}</b>${x.desc ? '<br>' + esc(x.desc) : ''}</p>`).join('')
    : `Nenhuma atividade em ${fmt(data)}.`;
}

const calendar = new FullCalendar.Calendar($('#calendar'), {
  locale: 'pt-br',
  initialView: 'dayGridMonth',
  height: 'auto',
  fixedWeekCount: false,
  headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
  events: eventos().map(e => ({
    id: e.id,
    title: e.titulo,
    start: e.hora ? `${e.data}T${e.hora}` : e.data
  })),
  dateClick: info => mostrarDetalhe(info.dateStr),
  eventClick: info => mostrarDetalhe(info.event.startStr.slice(0, 10))
});
calendar.render();
</script>
